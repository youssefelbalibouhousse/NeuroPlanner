[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroplanner"
version = "1.1.0"
description = "Planificateur de bureau pour un rythme d'apprentissage intensif basé sur la neuroplasticité."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Youssef El Bali" }]
keywords = ["learning", "spaced-repetition", "neuroplasticity", "customtkinter", "productivity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "customtkinter>=5.2",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
neuroplanner = "neuroplanner.__main__:main"

[project.gui-scripts]
neuroplanner-gui = "neuroplanner.__main__:main"

[project.urls]
Homepage = "https://github.com/youssefelbalibouhousse/NeuroPlanner"
Repository = "https://github.com/youssefelbalibouhousse/NeuroPlanner"
Issues = "https://github.com/youssefelbalibouhousse/NeuroPlanner/issues"

[tool.setuptools]
packages = ["neuroplanner", "neuroplanner.data", "neuroplanner.services", "neuroplanner.ui"]

[tool.setuptools.package-data]
neuroplanner = ["assets/*.ico", "assets/*.png"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "gui: tests that open a Tk window (need a display server)",
]
